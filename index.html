<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D6B57">
<meta name="description" content="Rörlighetsprogram för hemmabruk med loggning, progression och golffokus.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Smidigare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobilförst, en kolumn, fast flikrad nederst; kort bara för övningar och statusrutor */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#16231E; --muted:#5B6B64; --line:#D7E0DB;
  --accent:#1D6B57; --accent-ink:#FFFFFF; --accent-soft:#DCEDE6;
  --sun:#E2A21B; --sun-soft:#FBF0D3; --warn:#B4442B; --warn-soft:#F8E1DA; --good:#2E7D4F;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1714; --surface:#17221E; --ink:#E5EEE9; --muted:#9AAEA5; --line:#2A3A33;
  --accent:#5CC4A2; --accent-ink:#0B1A15; --accent-soft:#1E3A30;
  --sun:#F0BC4A; --sun-soft:#3A3018; --warn:#F08B70; --warn-soft:#3D2019; --good:#6FD39A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1714; --surface:#17221E; --ink:#E5EEE9; --muted:#9AAEA5; --line:#2A3A33;
  --accent:#5CC4A2; --accent-ink:#0B1A15; --accent-soft:#1E3A30;
  --sun:#F0BC4A; --sun-soft:#3A3018; --warn:#F08B70; --warn-soft:#3D2019; --good:#6FD39A; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand small{display:block;color:var(--muted);font-size:.8rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.banner{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.banner.sun{background:var(--sun-soft)}
.banner.acc{background:var(--accent-soft)}
.banner.warn{background:var(--warn-soft)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;min-height:42px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
button.link{border:none;background:none;padding:4px 0;min-height:0;color:var(--accent);font-weight:600;text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.chip{min-height:38px;padding:6px 12px;border-radius:999px;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.bad[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;max-width:100%}
textarea{width:100%;min-height:90px}
label{display:flex;flex-direction:column;gap:4px;font-size:.92rem;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
[hidden]{display:none!important}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;padding:6px 2px;color:var(--muted);min-height:52px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs svg{width:22px;height:22px}
.sec-label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.ex{display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head > div{min-width:0}
.dose{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);white-space:nowrap}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.02em}
.tag.golf{background:var(--sun-soft);color:var(--ink)}
.steps{display:flex;gap:4px;align-items:center}
.steps i{display:block;width:16px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.ex.done{opacity:.72}
.ex.done .ex-head h3::after{content:" ✓";color:var(--good)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.92rem}
details[open] summary{margin-bottom:6px}
.timerbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--ink);color:var(--bg);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.timerbar .big{font-family:var(--f-display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.timerbar button{background:transparent;color:var(--bg);border-color:var(--bg)}
.week{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.day.today{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.day .d{font-family:var(--f-display);font-weight:800}
.day > div{min-width:0}
.ok{color:var(--good);font-weight:700}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tscroll{overflow-x:auto}
.kv{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 16px}
.prose{display:flex;flex-direction:column;gap:10px;max-width:65ch}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.ref{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;max-width:calc(100% - 32px)}
svg text{fill:var(--muted);font-family:var(--f-body)}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.ex{transition:opacity .2s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="var(--accent)"/><path d="M9 23c3-9 8-12 16-13" stroke="var(--accent-ink)" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="25" cy="10" r="2.6" fill="var(--sun)"/></svg>
      <div><h1 style="font-size:1.35rem">Smidigare</h1><small id="phaseLine">Rörlighet, styrka och golf</small></div>
    </div>
    <button class="ghost" id="settingsBtn" aria-label="Inställningar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="view" class="stack"><div class="card"><p class="muted">Laddar ditt program…</p></div></main>
</div>
<div id="timer" class="timerbar" hidden></div>
<nav class="tabs" id="tabs" aria-label="Huvudmeny"></nav>

<script>
// @@DATA_START
const PHASES = [
  {name:"Fas 1 · Grund", weeks:"v. 1–4", str:{sets:2,reps:"8–10"}, hold:30, bal:20, note:"Lär dig rörelserna, lugnt tempo, inga floor-krav."},
  {name:"Fas 2 · Bygga", weeks:"v. 5–8", str:{sets:2,reps:"10–12"}, hold:45, bal:30, note:"Längre stretch, fler repetitioner."},
  {name:"Fas 3 · Utveckla", weeks:"v. 9–16", str:{sets:3,reps:"10–12"}, hold:60, bal:30, note:"Full dos: 3 set styrka och 60 s stretch."}
];
const STRETCH_SETS = 2;

// cat: warm | mob | str | bal | stretch | breath. Steg markerade floor:true kräver att du kan gå ned på golvet.
const EX = {
 W1:{name:"Marsch på stället", cat:"warm", area:"Hela kroppen", steps:[
   {n:"Marsch med stöd", dose:"2 min", t:120, how:"Stå bakom en stol och håll lätt i ryggstödet. Marschera i lugnt tempo, lyft knäna så högt det känns bekvämt och låt armarna pendla."},
   {n:"Marsch med armsving", dose:"2 min", t:120, how:"Utan stöd om balansen tillåter. Lyft knäna mot höfthöjd och sväng armarna aktivt. Du ska bli lite varm, inte andfådd."},
   {n:"Marsch och sidosteg", dose:"3 min", t:180, how:"1 min marsch, 1 min sidosteg fram och tillbaka, 1 min marsch med högre knän."}]},
 W2:{name:"Axlar och armar", cat:"warm", area:"Axlar", steps:[
   {n:"Axelrullningar och armcirklar", dose:"10 per riktning", t:90, how:"Rulla axlarna bakåt 10 gånger och framåt 10 gånger. Gör sedan armcirklar som börjar små och blir större."},
   {n:"Armcirklar och kramar", dose:"10 + 10", t:90, how:"Stora armcirklar, sedan öppna armarna brett och korsa dem framför bröstet som en kram, omväxlande vilken arm som ligger överst."},
   {n:"Armsving med kvast", dose:"10 långsamma", t:90, how:"Håll en kvast eller pinne med brett grepp. För den långsamt upp över huvudet och så långt bakåt det går utan smärta, och tillbaka."}]},
 W3:{name:"Höftcirklar", cat:"warm", area:"Höfter", steps:[
   {n:"Höftcirklar med stöd", dose:"8 per riktning", t:90, how:"Händerna på stolsryggen, fötterna höftbrett. Rita stora, långsamma cirklar med bäckenet."},
   {n:"Knäcirklar", dose:"6 per riktning och ben", t:120, how:"Håll i stolen, lyft ena knät framför dig och rita cirklar med knät. Det smörjer höftleden."},
   {n:"Grinden", dose:"6 per ben och riktning", t:120, how:"Lyft knät framför dig, för det ut åt sidan och ned, som att kliva över en grind. Sedan baklänges."}]},
 W4:{name:"Katt och ko", cat:"warm", area:"Rygg", steps:[
   {n:"Sittande katt och ko", dose:"8 långsamma", t:90, how:"Sitt på stolskanten med händerna på knäna. Andas in och skjut fram bröstet. Andas ut, runda ryggen och dra in hakan."},
   {n:"Stående katt och ko", dose:"8 långsamma", t:90, how:"Stå med fötterna brett, mjuka knän och händerna på låren. Svanka och runda ryggen omväxlande, i takt med andningen."},
   {n:"Katt och ko på alla fyra", dose:"10 långsamma", t:90, floor:true, how:"På alla fyra med en kudde under knäna. Händerna under axlarna, knäna under höfterna. Rör dig kota för kota."}]},

 M1:{name:"Bålrotation", cat:"mob", golf:true, sides:true, area:"Bröstrygg", steps:[
   {n:"Sittande rotation, armarna i kors", dose:"8 per sida", how:"Sitt långt fram på stolen, fötterna stadigt i golvet, armarna i kors över bröstet. Vrid överkroppen åt ena hållet, håll 2 s, och tillbaka. Knäna står still."},
   {n:"Sittande rotation med kvast", dose:"8 per sida", how:"Lägg en kvast över skuldrorna och håll den med händerna. Vrid och andas ut i ändläget. Rörelsen ska komma mellan skulderbladen, inte från ländryggen."},
   {n:"Rotation i golfposition", dose:"8 per sida", how:"Stå som vid bollen: mjuka knän, fäll fram från höften, kvasten över bröstet. Vrid axlarna så långt du kan utan att höfterna följer med. Håll 3 s."}]},
 M2:{name:"Öppna boken", cat:"mob", golf:true, sides:true, area:"Bröstrygg och axel", steps:[
   {n:"Öppna boken mot vägg", dose:"8 per sida", how:"Stå med sidan mot en vägg, armarna raka framåt i axelhöjd. För den yttre armen i en båge bakåt mot väggen och följ handen med blicken. Bara så långt det känns bekvämt."},
   {n:"Öppna boken i sängen", dose:"8 per sida", how:"Ligg på sidan i sängen med knäna böjda och en kudde under huvudet, armarna raka framför dig. Öppna den övre armen i en båge bakåt, knäna ligger kvar ihop."},
   {n:"Öppna boken på golvet med paus", dose:"8 per sida", floor:true, how:"Som i sängen men på golvet, med en hoprullad handduk mellan knäna. Håll 3 s i ändläget och andas ut."}]},
 M3:{name:"Höftgångjärn", cat:"mob", golf:true, area:"Höft och baksida lår", steps:[
   {n:"Rumpan mot väggen", dose:"10", how:"Stå med ryggen en fotlängd från en vägg. Skjut rumpan bakåt mot väggen med rak rygg och mjuka knän tills den nuddar. Tryck dig tillbaka med sätet."},
   {n:"Höftgångjärn med kvast", dose:"10", how:"Håll kvasten längs ryggen så att den har kontakt med bakhuvud, mellan skulderbladen och korsryggen. Fäll framåt från höften utan att tappa kontakten. Det är golfens adressposition."},
   {n:"Enbens gångjärn med stöd", dose:"6 per ben", how:"En hand på stolen. Fäll framåt på ett ben medan det andra sträcks rakt bakåt, som att plocka upp en golfboll. Höften pekar mot golvet hela tiden."}]},
 M4:{name:"Benpendel", cat:"mob", sides:true, area:"Höfter", steps:[
   {n:"Benpendel framåt och bakåt", dose:"10 per ben", how:"Håll i en stol med en hand. Låt benet pendla avslappnat framåt och bakåt. Öka utslaget lite i taget."},
   {n:"Benpendel framåt och i sidled", dose:"10 + 10 per ben", how:"Först framåt–bakåt, sedan med båda händerna på stolen: pendla benet i sidled framför kroppen."},
   {n:"Benpendel och knäkram", dose:"10 + 5 per ben", how:"Benpendel som steg 2, avsluta med att dra knät mot bröstet med händerna och hålla 2 s, 5 gånger per sida."}]},
 M5:{name:"Bröstöppnare", cat:"mob", area:"Bröstrygg", steps:[
   {n:"Bakåtlutning över stolsryggen", dose:"8", how:"Sitt med ryggen mot ett stadigt ryggstöd, händerna knäppta bakom nacken. Luta överkroppen bakåt över ryggstödets kant så att armbågarna pekar uppåt. Andas in i ändläget."},
   {n:"Bröstöppnare mot bänk", dose:"8 × 3 s", how:"Stå framför köksbänken med armbågarna på kanten och händerna ihop. Skjut rumpan bakåt och låt bröstet sjunka mot golvet. Håll 3 s."},
   {n:"Handduksrulle på golvet", dose:"8 × 3 s", floor:true, how:"Ligg på rygg med en hårt rullad handduk tvärs under bröstryggen och händerna bakom huvudet. Luta dig bakåt över rullen. Flytta rullen ett snäpp och upprepa."}]},
 M6:{name:"Knä mot vägg", cat:"mob", sides:true, area:"Fotled", steps:[
   {n:"Knä mot vägg", dose:"10 per sida", how:"Stå vänd mot väggen med ena foten en handsbredd från den, händerna mot väggen. För knät fram mot väggen utan att hälen lyfter."},
   {n:"Knä mot vägg, längre ut", dose:"10 per sida", how:"Flytta foten en bit längre från väggen. Hälen ska fortfarande ligga kvar när knät nuddar."},
   {n:"Knä mot vägg i tre riktningar", dose:"6 × 3 per sida", how:"För knät mot väggen rakt fram, sedan ut mot lilltån och in mot stortån."}]},
 M7:{name:"Handleder och underarmar", cat:"mob", golf:true, area:"Handled", steps:[
   {n:"Handledsåttor och bönestretch", dose:"10 + 20 s", how:"Knäpp händerna och rita åttor 10 gånger. Pressa sedan handflatorna ihop framför bröstet och sänk händerna tills det sträcker, 20 s."},
   {n:"Underarmsstretch mot bord", dose:"20 s + 20 s", how:"Händerna på bordet med fingrarna mot dig och raka armar, luta lätt bakåt. Vänd sedan händerna och lägg handryggarna mot bordet."},
   {n:"Vindrutetorkare med kvast", dose:"10 per hand", how:"Håll kvasten i ena änden rakt upp. Vrid långsamt åt båda sidorna med underarmen, som en vindrutetorkare. Kortare grepp blir lättare."}]},
 M8:{name:"Vägg-glid", cat:"mob", area:"Axlar", steps:[
   {n:"Underarmarna mot väggen", dose:"8–10", how:"Stå vänd mot väggen med underarmarna mot den, armbågarna i axelhöjd. Glid uppåt så långt det går bekvämt. Dra ned skulderbladen när du kommer tillbaka."},
   {n:"Ryggen mot väggen", dose:"8–10", how:"Stå med rygg och bakhuvud mot väggen, fötterna en bit ut. Armarna i W-form mot väggen, glid upp till Y och tillbaka."},
   {n:"W till Y med lyft", dose:"8–10", how:"Som steg 2, men lyft händerna 2 cm från väggen i toppläget och håll 2 s."}]},
 M9:{name:"Höftrotation", cat:"mob", golf:true, sides:true, area:"Höftrotation", steps:[
   {n:"Sittande höftrotation", dose:"8 per sida", how:"Sitt på stolskanten med knäna i 90°. Håll knät still och låt foten glida utåt och sedan inåt. Det vrider höftleden åt båda hållen, som i golfsvingen."},
   {n:"Vindrutetorkare med knäna", dose:"8 per sida", how:"Sitt i sängen eller på golvet med händerna bakom dig och fötterna brett. Fäll båda knäna åt ena sidan och sedan åt den andra."},
   {n:"90/90-sittande", dose:"6 per sida", floor:true, how:"Sitt på golvet med båda knäna böjda 90°, ett framför och ett åt sidan. Sitt lång i ryggen och växla sida med hjälp av händerna."}]},

 S1:{name:"Uppresning från stol", cat:"str", area:"Ben och säte", steps:[
   {n:"Med armstöd", how:"Hög stol eller kudde på sitsen. Fötterna bakom knäna, luta fram med näsan över tårna och res dig. Ta hjälp av armstöden så lite som möjligt."},
   {n:"Utan händer", how:"Armarna i kors över bröstet. Res dig utan att svänga. Sätt dig kontrollerat."},
   {n:"Långsam med vikt", how:"Håll en kasse med vattenflaskor (3–6 kg) mot bröstet. Sätt dig på 3 s och res dig i normal fart."}]},
 S2:{name:"Armhävning", cat:"str", area:"Bröst och armar", steps:[
   {n:"Mot vägg", how:"Händerna mot väggen i axelhöjd, fötterna en bit ut. Kroppen rak som en planka, böj armarna tills näsan nästan nuddar."},
   {n:"Mot köksbänk", how:"Händerna på bänkskivan. Lägre vinkel ger mer vikt på armarna. Spänn magen."},
   {n:"Mot stol eller soffkant", how:"Stadig stol mot väggen eller soffkant. Kroppen rak, sänk bröstet kontrollerat."}]},

function maxStep(ex, floorOk){
  let m = ex.steps.length;
  if(!floorOk){ for(let i=0;i<ex.steps.length;i++){ if(ex.steps[i].floor){ m = i; break; } } }
  return Math.max(1, m);
}
function doseFor(id, stepIdx, phase, light){
  const ex = EX[id], st = ex.steps[stepIdx] || ex.steps[0], P = PHASES[phase];
  const per = ex.sides ? " per sida" : "";
  switch(ex.cat){
    case "warm": case "mob": case "breath": return {text: st.dose, sec: st.t || (ex.sides?120:90)};
    case "str": {
      if(light) return {text:"1 × 8"+per+", lätt", sec: ex.sides?90:60};
      const sets = ex.skill ? 2 : P.str.sets;
      const reps = st.reps || P.str.reps;
      return {text: `${sets} × ${reps}${per}`, sec: sets*((ex.sides?2:1)*40 + 45), sets};
    }
    case "bal": {
      if(st.dose) return {text: st.dose, sec: st.t};
      return {text:`2 × ${P.bal} s${per}`, sec: 2*P.bal*(ex.sides?2:1)+15, hold:P.bal, sets:2};
    }
    case "stretch": {
      const both = id==="T4" && stepIdx===2;
      const sides = ex.sides && !both;
      return {text:`${STRETCH_SETS} × ${P.hold} s${sides?per:""}`, sec: STRETCH_SETS*P.hold*(sides?2:1)+20, hold:P.hold, sets:STRETCH_SETS, sides};
    }
  }
  return {text:"", sec:60};
}
function estMinutes(tpl, phase, steps, floorOk){
  const T = TEMPLATES[tpl]; let s = 0;
  for(const id of T.items){
    const st = Math.min((steps[id]?.step ?? 1), maxStep(EX[id], floorOk)) - 1;
    s += doseFor(id, st, phase, T.light).sec + 15; // +15 s byte mellan övningar
  }
  return Math.round(s/60);
}

const LS_KEY = "smidigare.v1";
const store = {
  mode:"local", db:null, uid:null, q:Promise.resolve(),
  async init(){
    try{
      if(window.claude && typeof window.claude.use === "function"){
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if(db && user){ const id = await user.id(); if(id){ this.db = db; this.uid = id; this.mode = "db"; } }
      }
    }catch(e){ console.warn("db saknas", e); }
  },
  stateRef(){ return this.db.doc(`data/users/${this.uid}/state`); },
  async load(){
    if(this.mode === "db"){
      const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000));
      try{
        const run = async ()=>{
          const s = await this.stateRef().get();
          const logs = await this.stateRef().collection("logs").orderBy("ts","desc").limit(500).get();
          const tests = await this.stateRef().collection("tests").orderBy("ts","desc").limit(100).get();
          return { state: s.exists ? s.data() : null, logs: logs.docs.map(d=>({...d.data(), _id:d.id})), tests: tests.docs.map(d=>({...d.data(), _id:d.id})) };
        };
        return await Promise.race([run(), timeout]);
      }catch(e){ console.warn(e); toast("Kunde inte nå lagringen. Visar lokal kopia."); this.mode = "local"; }
    }
    try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const d = JSON.parse(raw); return {state:d.state||null, logs:d.logs||[], tests:d.tests||[]}; } }catch(e){}
    return {state:null, logs:[], tests:[]};
  },
  local(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({state:S.state, logs:S.logs, tests:S.tests})); }catch(e){} },
  saveState(){
    this.local();
    if(this.mode !== "db") return Promise.resolve();
    const snap = JSON.parse(JSON.stringify(S.state));
    this.q = this.q.then(()=>this.stateRef().set(snap)).catch(e=>{ console.warn(e); toast("Sparningen misslyckades. Försök igen senare."); });
    return this.q;
  },
  async add(coll, entry){
    if(this.mode === "db"){
      try{ const ref = await this.stateRef().collection(coll).add(entry); entry._id = ref.id; }
      catch(e){ console.warn(e); toast("Kunde inte spara i molnet, sparat lokalt."); }
    }
    this.local();
  },
  async update(coll, entry){
    if(this.mode === "db" && entry._id){
      try{ const {_id, ...data} = entry; await this.stateRef().collection(coll).doc(_id).set(data); }
      catch(e){ console.warn(e); toast("Kunde inte spara i molnet, sparat lokalt."); }
    }
    this.local();
  },
  async remove(coll, entry){
    if(this.mode === "db" && entry._id){ try{ await this.stateRef().collection(coll).doc(entry._id).delete(); }catch(e){ console.warn(e); } }
    this.local();
  }
};

const S = { state:null, logs:[], tests:[], tab:"idag", session:null, view:null, editTest:null };
const today = () => isoDate(new Date());
function isoDate(d){ const z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function fmtDate(s){ const d=parseISO(s); return d.toLocaleDateString("sv-SE",{weekday:"short",day:"numeric",month:"short"}); }
function newState(){
  const steps = {}; Object.keys(EX).forEach(id=>steps[id]={step:1,easy:0,hard:0});
  return { v:1, startDate:today(), phase:0, phaseStart:today(), steps, settings:{floor:false, walk:true}, notices:[], onboarded:false, updateFlag:false };
}
function migrate(st){
  Object.keys(EX).forEach(id=>{ if(!st.steps[id]) st.steps[id]={step:1,easy:0,hard:0}; });
  st.settings = Object.assign({floor:false, walk:true}, st.settings||{});
  st.notices = st.notices || [];
  return st;
}
function sessionLogs(){ return S.logs.filter(l=>l.type==="session"); }
function adherence14(){
  const t = today();
  const n = sessionLogs().filter(l=>{ const d=daysBetween(l.date,t); return d>=0 && d<14 && l.template!=="P"; });
  const days = new Set(n.map(l=>l.date)).size;
  return Math.min(1, days/10); // 5 planerade pass per vecka
}
function addNotice(text, kind="acc"){ S.state.notices.unshift({date:today(), text, kind}); S.state.notices = S.state.notices.slice(0,12); }

/* ------------- Progression ------------- */
function applyProgression(entry){
  const st = S.state, floorOk = st.settings.floor;
  for(const it of entry.items){
    if(!it.done || TEMPLATES[entry.template].light) continue;
    const ex = EX[it.id], rec = st.steps[it.id], max = maxStep(ex, floorOk);
    if(it.pain){
      rec.easy = 0; rec.hard = 0;
      if(rec.step > 1){ rec.step--; addNotice(`${ex.name}: tillbaka till steg ${rec.step} (${ex.steps[rec.step-1].n}) eftersom det gjorde ont. Gå bara så långt det känns okej.`, "warn"); }
      else addNotice(`${ex.name} gjorde ont. Minska rörelseomfånget, och hoppa över den om smärtan är kvar nästa morgon.`, "warn");
      continue;
    }
    if(it.rating === "easy"){ rec.easy++; rec.hard = 0;
      if(rec.easy >= 3){ rec.easy = 0;
        if(rec.step < max){ rec.step++; addNotice(`${ex.name}: upp till steg ${rec.step}, ${ex.steps[rec.step-1].n}. Bra jobbat!`); }
        else rec.maxed = true;
      }
    } else if(it.rating === "hard"){ rec.hard++; rec.easy = 0;
      if(rec.hard >= 2){ rec.hard = 0; if(rec.step > 1){ rec.step--; addNotice(`${ex.name}: tillbaka till steg ${rec.step} ett tag. Det är helt normalt.`, "warn"); } }
    } else if(it.rating === "ok"){ rec.easy = Math.max(0, rec.easy-1); rec.hard = 0; }
  }
  checkPhase();
}
function checkPhase(){
  const st = S.state, inPhase = daysBetween(st.phaseStart, today()), adh = adherence14();
  if(st.phase < 2 && inPhase >= 28){
    if(adh >= 0.6){ st.phase++; st.phaseStart = today(); addNotice(`Du går upp till ${PHASES[st.phase].name}. ${PHASES[st.phase].note}`); }
    else if(!st.lowAdhNote || daysBetween(st.lowAdhNote, today()) >= 7){ st.lowAdhNote = today(); addNotice(`Du stannar i ${PHASES[st.phase].name} en vecka till. Sikta på minst 3–4 pass i veckan, då kommer du vidare.`, "sun"); }
  }
  st.updateFlag = needsUpdate();
}
function needsUpdate(){
  const st = S.state; const floorOk = st.settings.floor;
  const ids = USED.filter(id=>EX[id].steps.length>1);
  const top = ids.filter(id=>st.steps[id].step >= EX[id].steps.length).length / ids.length;
  const capped = ids.filter(id=>st.steps[id].step >= maxStep(EX[id], floorOk) && (st.steps[id].maxed)).length / ids.length;
  return (st.phase === 2 && daysBetween(st.phaseStart, today()) >= 56) || top >= 0.75 || capped >= 0.75;
}

const $ = s => document.querySelector(s);
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null || v===false) continue;
    if(k==="class") el.className = v; else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if(k==="html") el.innerHTML = v; else el.setAttribute(k, v===true?"":v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))); }
  return el;
}

let timerInt = null, audioCtx = null, wakeLock = null;
function beep(freq=880, ms=180){
  try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.15,audioCtx.currentTime); o.start(); o.stop(audioCtx.currentTime+ms/1000); }catch(e){}
}

function runTimer(name, hold, sets, sides){
  stopTimer(); beep(660,80);
  const plan = [];
  for(let s=1;s<=sets;s++){ if(sides){ plan.push({l:`${name} · set ${s} · vänster`, t:hold}); plan.push({l:"Byt sida", t:5, gap:true}); plan.push({l:`${name} · set ${s} · höger`, t:hold}); } else plan.push({l:`${name} · set ${s}`, t:hold}); if(s<sets) plan.push({l:"Vila, andas", t:10, gap:true}); }
  playPlan(plan, ()=>{ toast("Klart! Välj Lätt, Lagom eller Tungt."); });
}
function runBreath(){
  stopTimer(); const plan=[]; for(let i=0;i<12;i++){ plan.push({l:"Andas in genom näsan", t:4}); plan.push({l:"Andas ut genom munnen", t:6, gap:true}); }
  playPlan(plan, ()=>toast("Bra. Passet är snart klart."));

function playPlan(plan, onEnd){
  const bar = $("#timer"); let i=0, left=plan[0].t;
  const draw = ()=>{ bar.innerHTML=""; bar.append(h("div",{style:"min-width:0"}, h("div",{class:"small"}, plan[i].l), h("div",{class:"big"}, fmtSec(left))), h("button",{onclick:stopTimer},"Stoppa")); bar.hidden=false; };

    left--; if(left<=3 && left>0 && !plan[i].gap) beep(520,60);
    if(left<=0){ i++; if(i>=plan.length){ beep(988,400); stopTimer(); onEnd&&onEnd(); return; } beep(plan[i].gap?440:880,160); left=plan[i].t; }
    draw();

}

function spark(arr){

  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.setAttribute("width",w); svg.setAttribute("height",hh); svg.setAttribute("viewBox",`0 0 ${w} ${hh}`);
  svg.innerHTML = `<polyline points="${pts.map(q=>q.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="var(--accent)"/>`;

async function saveBackup(){

  }catch(e){ if(e && e.code === "declined"){ toast("Avbrutet, ingen kopia sparad"); return; } }

  try{
    const url = URL.createObjectURL(new Blob([json], {type:"text/plain"}));
    const a = h("a",{href:url, download:name}); document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    markBackup(); toast("Filen ligger i Nedladdningar. Ladda upp den till Drive."); return;
  }catch(e){}
  toast("Kunde inte spara filen. Använd Kopiera som text längre ned.");
}
async function importBackup(d){
  if(!d || !d.state || !d.state.steps) throw new Error("ogiltig");
  const lastBackup = S.state.lastBackup;
  S.state = migrate(d.state); S.state.lastBackup = lastBackup || d.state.lastBackup;
  const newLogs = (d.logs||[]).filter(l=>!S.logs.some(x=>x.ts===l.ts));
  const newTests = (d.tests||[]).filter(l=>!S.tests.some(x=>x.ts===l.ts));
  for(const l of newLogs){ delete l._id; S.logs.push(l); await store.add("logs",l); }
  for(const t of newTests){ delete t._id; S.tests.push(t); await store.add("tests",t); }
  S.logs.sort((a,b)=>b.ts-a.ts); S.tests.sort((a,b)=>b.ts-a.ts);
  await store.saveState();
  return newLogs.length + newTests.length;
}
function backupCard(){
  const last = S.state.lastBackup;
  const fileIn = h("input",{type:"file",id:"bkFile",accept:".txt,.json,text/plain,application/json",hidden:true});
  fileIn.addEventListener("change",()=>{
    const f = fileIn.files && fileIn.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = async()=>{ try{ const n = await importBackup(JSON.parse(r.result)); toast(`Återställt. ${n} nya poster lades till.`); render(); }catch(e){ toast("Filen är ingen giltig säkerhetskopia från Smidigare"); } };
    r.readAsText(f);
  });
  return h("div",{class:"card stack"},
    h("h3",{},"Säkerhetskopia till Google Drive"),
    h("p",{class:"small"}, "Tryck på Spara till Google Drive. I menyn som öppnas väljer du ", h("b",{},"Drive"), ", sedan mapp, och trycker Spara. Varje kopia innehåller allt: program, steg, pass, promenader och tester."),
    h("p",{class:"small muted"}, last ? `Senaste säkerhetskopia: ${fmtDate(last)} (${daysBetween(last,today())} dagar sedan).` : "Ingen säkerhetskopia gjord ännu."),
    h("div",{class:"row"}, h("button",{class:"primary",onclick:saveBackup},"Spara till Google Drive"), h("button",{onclick:()=>fileIn.click()},"Återställ från fil"), fileIn),
    h("p",{class:"small muted"},"Återställ: välj filen i Drive i filväljaren (tryck på menyn ☰ och välj Drive). Poster som redan finns läggs inte till två gånger."),
    h("details",{}, h("summary",{},"Kopiera som text (reserv)"), backupBox()));
}
function backupBanner(){
  return h("div",{class:"banner acc"}, h("h3",{},"Dags att säkerhetskopiera"),
    h("p",{class:"small"}, S.state.lastBackup ? `Senaste kopian gjordes ${fmtDate(S.state.lastBackup)}. Spara en ny till Google Drive så att inget försvinner om telefonen byts eller rensas.` : "Dina data finns bara i den här telefonen. Spara en kopia till Google Drive så att inget försvinner."),
    h("div",{}, h("button",{class:"primary",onclick:saveBackup},"Spara till Google Drive")));
}
function backupBox(){
  const out = h("textarea",{id:"bkOut",readonly:true}); out.value = backupJSON();
  const inp = h("textarea",{id:"bkIn",placeholder:"Klistra in en säkerhetskopia här för att återställa"});
  return h("div",{class:"stack"}, out, h("div",{}, h("button",{onclick:()=>copyText(out.value,out)},"Kopiera säkerhetskopia")), inp,
    h("div",{}, h("button",{onclick:async()=>{ try{ const n = await importBackup(JSON.parse(inp.value)); toast(`Återställt. ${n} nya poster lades till.`); render(); }catch(e){ toast("Texten är ingen giltig säkerhetskopia"); } }},"Återställ från text")));
}

/* ---------- Start ---------- */
$("#settingsBtn").addEventListener("click",()=>{ if(S.state && S.state.onboarded){ S.tab="settings"; render(); window.scrollTo(0,0); } });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.session) wake(true); });
(async function boot(){
  renderTabs();
  await store.init();
  const d = await store.load();
  S.state = d.state ? migrate(d.state) : newState();
  S.logs = d.logs.sort((a,b)=>b.ts-a.ts); S.tests = d.tests.sort((a,b)=>b.ts-a.ts);
  if(S.state.onboarded){ checkPhase(); }
  render();
})();
</script>

if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
